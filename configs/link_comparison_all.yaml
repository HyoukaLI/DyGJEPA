seed: [0, 1, 2, 3, 4]
device: auto
output_dir: results
summary_output_path: results/link_comparison_all.json

# One shared protocol/model config, with only dataset-specific dimensions and
# author-reported DyGLib best settings overridden below. The driver expands
# each entry into an independent run and reinitializes every baseline.
datasets:
  - name: wikipedia
    path: data/processed/wikipedia.npz
    interaction_feature_dim: 172
    state_change: true
    # Dataset-specific DyGJEPA width/optimization tuning. Baseline settings and
    # the shared DyGLib data/evaluation protocol remain untouched.
    overrides:
      rcps_jepa:
        hidden_dim: 128
        rwpe_dim: 4
        rwpe_walks: 8
        time_dim: 32
        predictor_hidden_dim: 256
        event_dim: 16
        subgraph_budget: 32
        history_semantic_dim: 32
        id_embedding_dim: 128
        id_embedding_dropout: 0.2
        initial_id_score_scale: 0.5
        train_negative_ratio: 4.0
        node_loss_weight: 0.01
        relation_loss_weight: 0.01
        rank_loss_weight: 1.0
        variance_loss_weight: 0.002
        covariance_loss_weight: 0.0002
      rcps_training:
        epochs: 60
        pair_batch_size: 500
        learning_rate: 0.0001
        lr_patience: 4
        min_learning_rate: 0.000005
        weight_decay: 0.00001
        patience: 12
  - name: mooc
    path: data/processed/mooc.npz
    interaction_feature_dim: 4
    state_change: true
    overrides:
      # v1 (2026-09-09): the wikipedia DyGJEPA recipe with the transductive
      # user x item ID residual switched off (affinities learned in the training
      # bins drift on MOOC).  seed 0: test AP 0.8336 / AUC 0.8400 (base 0.8156 /
      # 0.8297).
      # v2: train_negative_ratio 4 -> 16 with pair_batch_size 500 -> 1700 (~100
      # positives per step).  MOOC has only 97 destinations, so the listwise
      # rank loss over 1+16 candidates approaches a full-catalog softmax.
      # seed 0: test AP 0.8371 / AUC 0.8412 (+0.35 / +0.12 over v1).
      # v3: window_size 3 -> seed 0: 0.8355 / 0.8408 (flat / within the
      # +-0.5 epoch-to-epoch validation noise); window_size restored to 4 so
      # common_model stays shared with the baselines.
      # v4: shuffle_windows false (training windows in chronological order, so
      # the checkpointed weights come from the most recent training bins).
      # seed 0: 0.8377 / 0.8436, smoother validation curve, mean_prob back to
      # 0.49.  v1-v4 together: 0.8156 -> 0.8377; the last three rounds are
      # within the +-0.5 single-seed noise, i.e. the config-only plateau.
      # This block is the MOOC configuration to use for the 5-seed run.
      # Baseline settings below are unchanged.
      rcps_jepa:
        shuffle_windows: false
        hidden_dim: 128
        rwpe_dim: 4
        rwpe_walks: 8
        time_dim: 32
        predictor_hidden_dim: 256
        event_dim: 16
        subgraph_budget: 32
        history_semantic_dim: 32
        id_embedding_dim: 0
        train_negative_ratio: 16.0
        node_loss_weight: 0.01
        relation_loss_weight: 0.01
        rank_loss_weight: 1.0
        variance_loss_weight: 0.002
        covariance_loss_weight: 0.0002
      rcps_training:
        epochs: 60
        pair_batch_size: 1700
        learning_rate: 0.0001
        lr_patience: 4
        min_learning_rate: 0.000005
        weight_decay: 0.00001
        patience: 12
      dyrep:
        dropout: 0.0
      tgat:
        uniform_neighbors: false
      tgn:
        dropout: 0.2
      cawn:
        num_neighbors: 64
      graphmixer:
        num_neighbors: 20
        dropout: 0.4
      dygformer:
        patch_size: 8
        max_input_sequence_length: 256
      jodie:
        dropout: 0.2
  - name: lastfm
    path: data/processed/lastfm.npz
    interaction_feature_dim: 2
    state_change: false
    overrides:
      dyrep:
        dropout: 0.0
      tgat:
        uniform_neighbors: false
      tgn:
        dropout: 0.3
      cawn:
        num_neighbors: 128
      graphmixer:
        num_neighbors: 10
        dropout: 0.0
      dygformer:
        patch_size: 16
        max_input_sequence_length: 512
      jodie:
        dropout: 0.3
  # Homogeneous datasets use the same chronological split and corrupt only
  # the destination over the complete node set.  jodie here is DyGLib's
  # memory-model JODIE, which needs no user/item split; the bipartite author
  # implementation (jodie_author) is opt-in and limited to the user-item sets.
  - name: canparl
    path: data/processed/canparl.npz
    interaction_feature_dim: 1
    state_change: false
    models: &homogeneous_models
      [jodie, dyrep, tgat, edgebank, tgn, cawn, tcl, graphmixer, dygformer,
       cldg, maskdgnn, dvgmae, rcps_jepa]
    overrides:
      dyrep: {dropout: 0.0, sample_neighbor_strategy: uniform}
      tgat: {dropout: 0.2, uniform_neighbors: true}
      tgn: {dropout: 0.3, sample_neighbor_strategy: uniform}
      cawn: {num_neighbors: 128, dropout: 0.0}
      tcl: {dropout: 0.2, sample_neighbor_strategy: uniform}
      graphmixer: {num_neighbors: 20, dropout: 0.2, sample_neighbor_strategy: uniform}
      dygformer: {patch_size: 64, max_input_sequence_length: 2048, dropout: 0.1}
      jodie: {dropout: 0.0}
      # DyGJEPA tuning on CanParl (2026-09-09).  Before v1 this block had no DyGJEPA
      # override, so CanParl ran on the file-level defaults (id 64, 1:1
      # training negatives, lr 3e-4): test AP 0.7386 / AUC 0.8288 (5 seeds).
      # v1 = the Wikipedia recipe.  history_semantic_dim stays 16: CanParl's
      # only edge feature is the 1-d vote weight and the per-event layer norm
      # of a 1-d feature is identically zero, so the semantic profiles carry
      # nothing here whatever the width.
      # v1 result (5 seeds 42-50, 2026-09-14): test AP 73.78 +- 2.14 / AUC
      # 82.62 +- 1.64 = same as the defaults (73.86 / 82.88); seed 50 fell to
      # 69.9.  AP - AUC gap still 9 pt, test mean_prob 0.13-0.21.
      # v2 (2026-09-14): switch off the two transductive "repeat" terms of the
      # link head - id_embedding_dim 0 and use_causal_history false.  Both
      # score (MP, former hub) pairs high from training-year interactions, but
      # half of each year's hubs are new and repeat edges only reach AUC 0.60
      # here, so these are the likely high-scoring negatives behind the AP gap.
      # Tested together first (same mechanism); split them only if it helps.
      # Remaining single factors: subgraph_budget 64 (CN coverage of hubs),
      # train_negative_ratio 16 + pair_batch_size 1700 (244 candidates).
      rcps_jepa:
        use_causal_history: false
        hidden_dim: 128
        rwpe_dim: 4
        rwpe_walks: 8
        time_dim: 32
        predictor_hidden_dim: 256
        event_dim: 16
        subgraph_budget: 32
        history_semantic_dim: 16
        id_embedding_dim: 0
        train_negative_ratio: 4.0
        node_loss_weight: 0.01
        relation_loss_weight: 0.01
        rank_loss_weight: 1.0
        variance_loss_weight: 0.002
        covariance_loss_weight: 0.0002
      rcps_training:
        epochs: 60
        pair_batch_size: 500
        learning_rate: 0.0001
        lr_patience: 4
        min_learning_rate: 0.000005
        weight_decay: 0.00001
        patience: 12
  - name: contacts
    path: data/processed/contacts.npz
    interaction_feature_dim: 1
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.0, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.1, uniform_neighbors: false}
      tgn: {dropout: 0.1, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 64, dropout: 0.1}
      tcl: {dropout: 0.0, sample_neighbor_strategy: recent}
      graphmixer: {num_neighbors: 20, dropout: 0.1, sample_neighbor_strategy: recent}
      dygformer: {patch_size: 1, max_input_sequence_length: 32, dropout: 0.0}
  - name: flights
    path: data/processed/flights.npz
    interaction_feature_dim: 1
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.1, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.1, uniform_neighbors: false}
      tgn: {dropout: 0.1, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 64, dropout: 0.1}
      tcl: {dropout: 0.1, sample_neighbor_strategy: recent}
      graphmixer: {num_neighbors: 20, dropout: 0.2, sample_neighbor_strategy: recent}
      dygformer: {patch_size: 8, max_input_sequence_length: 256, dropout: 0.1}
  - name: untrade
    path: data/processed/untrade.npz
    interaction_feature_dim: 1
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.1, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.1, uniform_neighbors: true}
      tgn: {dropout: 0.2, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 64, dropout: 0.1}
      tcl: {dropout: 0.0, sample_neighbor_strategy: uniform}
      graphmixer: {num_neighbors: 20, dropout: 0.1, sample_neighbor_strategy: uniform}
      dygformer: {patch_size: 8, max_input_sequence_length: 256, dropout: 0.0}
      jodie: {dropout: 0.4}
  - name: unvote
    path: data/processed/unvote.npz
    interaction_feature_dim: 1
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.1, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.2, uniform_neighbors: false}
      tgn: {dropout: 0.1, sample_neighbor_strategy: uniform}
      cawn: {num_neighbors: 64, dropout: 0.1}
      tcl: {dropout: 0.0, sample_neighbor_strategy: uniform}
      graphmixer: {num_neighbors: 20, dropout: 0.0, sample_neighbor_strategy: uniform}
      dygformer: {patch_size: 4, max_input_sequence_length: 128, dropout: 0.2}
  - name: uslegis
    path: data/processed/uslegis.npz
    interaction_feature_dim: 1
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.0, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.1, uniform_neighbors: false}
      tgn: {dropout: 0.1, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 32, dropout: 0.1}
      tcl: {dropout: 0.3, sample_neighbor_strategy: uniform}
      graphmixer: {num_neighbors: 20, dropout: 0.4, sample_neighbor_strategy: recent}
      dygformer: {patch_size: 8, max_input_sequence_length: 256, dropout: 0.0}
      jodie: {dropout: 0.2}
  - name: enron
    path: data/processed/enron.npz
    interaction_feature_dim: 32
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.0, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.2, uniform_neighbors: false}
      tgn: {dropout: 0.0, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 32, dropout: 0.1}
      tcl: {dropout: 0.1, sample_neighbor_strategy: recent}
      graphmixer: {num_neighbors: 20, dropout: 0.5, sample_neighbor_strategy: recent}
      dygformer: {patch_size: 8, max_input_sequence_length: 256, dropout: 0.0}
  - name: uci
    path: data/processed/uci.npz
    interaction_feature_dim: 100
    state_change: false
    models: *homogeneous_models
    overrides:
      dyrep: {dropout: 0.0, sample_neighbor_strategy: recent}
      tgat: {dropout: 0.1, uniform_neighbors: false}
      tgn: {dropout: 0.1, sample_neighbor_strategy: recent}
      cawn: {num_neighbors: 64, dropout: 0.1}
      tcl: {dropout: 0.0, sample_neighbor_strategy: recent}
      graphmixer: {num_neighbors: 20, dropout: 0.4, sample_neighbor_strategy: recent}
      dygformer: {patch_size: 1, max_input_sequence_length: 32, dropout: 0.1}
      jodie: {dropout: 0.4}

# DyGLib transductive protocol mapped to the discrete snapshot timeline:
# chronological 70/15/15 with no event shuffling across split boundaries.
split:
  train_ratio: 0.70
  validation_ratio: 0.15

common_model:
  hidden_dim: 128
  rwpe_dim: 4
  rwpe_walks: 8
  time_dim: 32
  gnn_layers: 2
  window_size: 4
  predictor_hidden_dim: 256
  rwpe_seed: 42
  cache_rwpe: true

# JODIE as reproduced in DyGLib: one shared node memory, an RNN memory updater
# and JODIE's time-projection embedding behind the common MergeLayer link head.
# This is the JODIE of DyGFormer / DyG-Mamba style tables and runs on every
# dataset; dataset entries above override dropout as in DyGLib's load_configs.
jodie:
  interaction_feature_dim: 172
  time_feat_dim: 100
  num_layers: 1
  num_heads: 2
  num_neighbors: 10
  dropout: 0.1
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

# Original bipartite JODIE (author implementation): coupled user/item RNNs,
# one-hot static embeddings, item-embedding regression and t-batches.  It only
# runs on the user-item datasets and only when requested with
# --models jodie_author.
jodie_author:
  # Original interaction vectors, auxiliary user-state objective when the
  # dataset supplies state labels, and the paper's 500 time spans.
  interaction_feature_dim: 172
  tbatch_count: 500
  state_change: true

# Author-maintained DyGLib DyRep configuration. The outer chronological split
# and evaluation candidates remain shared with the other comparison methods.
dyrep:
  interaction_feature_dim: 172
  time_feat_dim: 100
  num_layers: 1
  num_heads: 2
  num_neighbors: 10
  dropout: 0.1
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

# TGAT author-mechanism adapter. Wikipedia keeps author-repository sampling;
# MOOC and LastFM use the dataset-specific recent-neighbor setting below.
tgat:
  interaction_feature_dim: 172
  num_layers: 2
  num_heads: 2
  num_neighbors: 20
  dropout: 0.1
  uniform_neighbors: true
  train_batch_size: 200
  eval_group_batch_size: 16

# Author-maintained DyGLib backbones. The values below are Wikipedia defaults;
# dataset entries above override the settings reported for MOOC and LastFM.
# Only the outer split and evaluation candidate set are shared across methods.
additional_baselines:
  enabled: [edgebank, jodie, dyrep, tgn, cawn, tcl, graphmixer, dygformer]

edgebank:
  memory_mode: time_window_memory
  time_window_proportion: 0.15

# Discrete-time self-supervised representation baselines.  All three see only
# the chronological training snapshots during SSL pretraining; their encoders
# are then frozen and evaluated with the same PairMLP link probe and the common
# DyGLib one-positive/one-random-negative candidate groups.
snapshot_ssl_baselines:
  enabled: [cldg, maskdgnn, dvgmae]

# CLDG official-code mechanisms and defaults (GCN, four timespan views,
# symmetric InfoNCE at temperature 0.07).  Wikipedia was not an original CLDG
# dataset, so the 50 event bins are treated as discrete timespans.
cldg:
  hidden_dim: 128
  embedding_dim: 128
  num_layers: 2
  dropout: 0.0
  num_spans: 4
  num_views: 4
  view_strategy: sequential
  temperature: 0.07
  contrastive_batch_size: 1024
  probe_hidden_dim: 128

# MaskDGNN IJCAI'25 settings: activeness-aware temporal edge masking,
# two-layer normalized GCN and adaptive FFT filtering over four snapshots.
maskdgnn:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  window_size: 4
  mask_ratio: 0.3
  dynamics_ratio: 0.7
  dynamics_weight: 1.0
  existing_offset: 2.0
  new_node_offset: -0.5
  pagerank_damping: 0.85
  pagerank_steps: 10
  pretrain_pair_limit: 4096
  probe_hidden_dim: 128

# DVGMAE paper-level implementation.  It combines history-balanced temporal
# edge masking, a variational GCN encoder and a temporal/global decoder.
dvgmae:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  window_size: 4
  mask_ratio: 0.3
  history_balance: 0.5
  kl_weight: 0.001
  feature_weight: 0.1
  pretrain_pair_limit: 4096
  probe_hidden_dim: 128

# TGN: recent temporal neighbors and one graph-attention layer.
tgn:
  interaction_feature_dim: 172
  time_feat_dim: 100
  num_layers: 1
  num_heads: 2
  num_neighbors: 10
  dropout: 0.1
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

# CAWN: ICLR'21 causal anonymous walks; walk count is dataset-specific.
cawn:
  interaction_feature_dim: 172
  time_feat_dim: 100
  position_feat_dim: 172
  walk_length: 1
  num_walk_heads: 8
  num_neighbors: 32
  dropout: 0.1
  sample_neighbor_strategy: time_interval_aware
  time_scaling_factor: 0.000001
  train_batch_size: 200
  eval_pair_batch_size: 200

# TCL: two-layer temporal collaborative Transformer.
tcl:
  interaction_feature_dim: 172
  time_feat_dim: 100
  num_layers: 2
  num_heads: 2
  num_neighbors: 20
  dropout: 0.1
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

# GraphMixer: ICLR'23; neighbor count/dropout are dataset-specific.
graphmixer:
  interaction_feature_dim: 172
  time_feat_dim: 100
  num_layers: 2
  num_neighbors: 30
  time_gap: 2000
  dropout: 0.5
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

# DyGFormer: author implementation; sequence length/patch size are dataset-specific.
dygformer:
  interaction_feature_dim: 172
  time_feat_dim: 100
  channel_embedding_dim: 50
  patch_size: 1
  num_layers: 2
  num_heads: 2
  dropout: 0.1
  max_input_sequence_length: 32
  sample_neighbor_strategy: recent
  train_batch_size: 200
  eval_pair_batch_size: 200

rcps_jepa:
  event_dim: 16
  signature_depth: 2
  subgraph_budget: 32
  path_decay: 0.8
  bridge_weight: 1.0
  ema_momentum: 0.999
  # Duplicate-preserving, full-prefix pair memory.  Each row uses only events
  # from snapshots strictly earlier than the prediction snapshot.
  use_causal_history: true
  # Compress past raw event vectors and retain pair/source/destination semantic
  # profiles for both repeated and previously unseen candidate links.
  history_semantic_dim: 16
  # Transductive collaborative-filtering residual in the supervised link head.
  # It does not enter the JEPA target branch.
  id_embedding_dim: 64
  # Keep the EMA update epoch-based because the number of DyGLib-sized
  # minibatches varies by dataset.
  ema_steps_per_epoch: null
  ema_update_per_step: true
  # Balanced 1:1 DyGLib candidates have prior probability 0.5.
  initial_link_logit_bias: 0.0
  shuffle_windows: true
  # Use every target-window positive while training; evaluation still follows
  # link.max_positive_pairs so the candidate protocol stays comparable.
  train_max_positive_pairs: null
  node_loss_weight: 0.02
  relation_loss_weight: 0.02
  link_loss_weight: 1.0
  # Directly optimize the shared one-positive/one-negative ordering.
  rank_loss_weight: 1.0
  variance_loss_weight: 0.005
  covariance_loss_weight: 0.0005
  variance_target: 0.5

link:
  # DyGLib random-negative protocol: one positive and one uniformly corrupted
  # destination. The candidate support is populated from the complete event
  # stream by the driver, exactly as NegativeEdgeSampler does.
  negative_ratio: 1.0
  max_positive_pairs: null
  allow_negative_collisions: true
  # DyGLib averages AP/AUC over batches containing 200 positive events and
  # their 200 random negatives.
  eval_positive_batch_size: 200
  new_edges_only: false
  undirected: false
  # Evaluation negative strategy, as in DyGLib evaluate_link_prediction.py.
  #   random     - the protocol above (default).
  #   historical - Poursafaei et al. 2022: each negative is an edge observed
  #                before the 200-event batch but absent from it, with both
  #                endpoints replaced; a pool shorter than the batch is filled
  #                with random (source, destination) pairs.  Training and
  #                checkpoint selection keep random negatives; only the final
  #                validation/test pass scores one shared pre-sampled table
  #                (validation seed 0, test seed 2).  Results are written to
  #                *_historical.json so random results are never overwritten.
  #   inductive  - same mechanics, but the pool only holds edges first seen
  #                during the evaluation period (after the last training
  #                timestamp for validation, after the last validation
  #                timestamp for test), i.e. DyGLib's inductive_sample.
  #                Results go to *_inductive.json.
  negative_strategy: random

# Shared evaluation/checkpoint cadence only. Optimizer settings are intentionally
# model-specific; they are not part of the common comparison protocol.
training:
  eval_every: 1
  patience: 20
  checkpoint_metrics: [ap, auc]
  validation_query_seed: 0
  test_query_seed: 2

# JODIE author-code defaults for interaction prediction (jodie_author only).
jodie_author_training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_clip: 1.0
  patience: 20

# TGAT author-code optimizer defaults.
tgat_training:
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  patience: 20

# DyGLib native optimizer defaults.  The adapter intentionally ignores
# grad_clip because the official training loop does not clip these gradients.
tgn_training: &dyglib_training
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  grad_clip: 1.0
  patience: 20

dyrep_training:
  <<: *dyglib_training

cawn_training:
  <<: *dyglib_training

tcl_training:
  <<: *dyglib_training

graphmixer_training:
  <<: *dyglib_training

dygformer_training:
  <<: *dyglib_training

# DyGLib JODIE trains with the same optimizer defaults as the other backbones.
jodie_training:
  <<: *dyglib_training

# Shared downstream budget for the three frozen-probe SSL baselines.
snapshot_ssl_training: &snapshot_ssl_training
  probe_epochs: 50
  probe_learning_rate: 0.001
  probe_weight_decay: 0.00001
  # 200 positive groups plus their one-to-one negatives.
  pair_batch_size: 400
  grad_clip: 1.0
  eval_every: 1
  patience: 20
  pretrain_log_every: 10

# CLDG official optimizer defaults are lr=4e-3 and weight_decay=5e-4.
cldg_training:
  <<: *snapshot_ssl_training
  pretrain_epochs: 100
  pretrain_learning_rate: 0.004
  pretrain_weight_decay: 0.0005

# MaskDGNN reports an inner learning rate of 0.008.  The unavailable official
# repository prevents byte-for-byte reproduction, so provenance is recorded
# as paper_reimplementation in the result JSON.
maskdgnn_training:
  <<: *snapshot_ssl_training
  pretrain_epochs: 100
  pretrain_learning_rate: 0.008
  pretrain_weight_decay: 0.0

dvgmae_training:
  <<: *snapshot_ssl_training
  pretrain_epochs: 100
  pretrain_learning_rate: 0.001
  pretrain_weight_decay: 0.00001

rcps_training:
  epochs: 100
  # 200 positive groups plus their one-to-one negatives.
  pair_batch_size: 400
  learning_rate: 0.0003
  lr_reduce_factor: 0.5
  lr_patience: 5
  min_learning_rate: 0.00001
  weight_decay: 0.00001
  grad_clip: 1.0
  eval_every: 1
  patience: 20
  # The causal recurrence prior is a valid parameter-free predictor; retain it
  # as epoch 0 if learned residuals do not improve validation AP.
  evaluate_before_training: true

