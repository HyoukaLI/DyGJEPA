# DyGJEPA ablation 'no_id': w/o transductive ID embeddings in the link head.
#
# Overlay of link_comparison_all.yaml: every dataset entry, model recipe and
# the DyGLib random-negative protocol are inherited; ablation.* is applied
# after the per-dataset overrides so the same module is removed everywhere.
# Launch with
#   bash scripts/run_link_ablation.sh no_id [datasets...]
#   VARIANT=no_id sbatch run_link_ablation.sbatch
base_config: ../link_comparison_all.yaml

models: [rcps_jepa]
# Same seeds as the main table runs.
seed: [42, 44, 46, 48, 50]

output_dir: results/ablation/no_id
summary_output_path: results/ablation/no_id/link_comparison_all.json

ablation:
  name: no_id
  rcps_jepa:
    id_embedding_dim: 0

wandb:
  tags: [ablation, no_id]
