# DyGJEPA ablation 'no_signature': w/o path signatures: the node signature (varsigma) and the pair signature (s) are replaced by zeros.
#
# Overlay of link_comparison_all.yaml: every dataset entry, model recipe and
# the DyGLib random-negative protocol are inherited; ablation.* is applied
# after the per-dataset overrides so the same module is removed everywhere.
# Launch with
#   bash scripts/run_link_ablation.sh no_signature [datasets...]
#   VARIANT=no_signature sbatch run_link_ablation.sbatch
base_config: ../link_comparison_all.yaml

models: [rcps_jepa]
# Same seeds as the main table runs.
seed: [42, 44, 46, 48, 50]

output_dir: results/ablation/no_signature
summary_output_path: results/ablation/no_signature/link_comparison_all.json

ablation:
  name: no_signature
  rcps_jepa:
    use_path_signature: false

wandb:
  tags: [ablation, no_signature]
