# DyGJEPA ablation 'prior_only': parameter-free recurrence prior only: no training epochs, the epoch-0 evaluation of the untrained model (zero-initialised link head plus the initial prior weights) is reported.
#
# Overlay of link_comparison_all.yaml: every dataset entry, model recipe and
# the DyGLib random-negative protocol are inherited; ablation.* is applied
# after the per-dataset overrides so the same module is removed everywhere.
# Launch with
#   bash scripts/run_link_ablation.sh prior_only [datasets...]
#   VARIANT=prior_only sbatch run_link_ablation.sbatch
base_config: ../link_comparison_all.yaml

models: [rcps_jepa]
# Same seeds as the main table runs.
seed: [42, 44, 46, 48, 50]

output_dir: results/ablation/prior_only
summary_output_path: results/ablation/prior_only/link_comparison_all.json

ablation:
  name: prior_only
  rcps_training:
    epochs: 0

wandb:
  tags: [ablation, prior_only]
